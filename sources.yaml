# Annonces à surveiller. "anchor" = texte qui repère le bien dans la page.
# price_side : after (défaut) = le prix suit l'ancre | before = il la précède.
# window     : nombre de caractères examinés autour de l'ancre (défaut 300).
# check_sold : false = ne pas se fier aux mots "VENDU" de la page (statut "inconnu").
# expected_price : prix vérifié à la main ; sert de contrôle anti-erreur de parsing.
sources:
  - id: vohilava
    name: Villas de Vohilava (BEST IMMO)
    url: https://www.bestimmostm.com/hotel-a-vendre-bord-de-mer-vohilava-sainte-marie/
    anchor: Vohilava
    units: 4
    expected_price: 480000
    feeds_model: true          # ce prix alimente Scenario Rachat!C5

  # Ceraolo : la page contient des étiquettes "VENDU" sur tous les blocs
  # (Wix) -> check_sold: false, statut à confirmer auprès de l'agence.
  - id: hotel-east
    name: Hotel East (Ceraolo)
    url: https://www.ceraolo-immobilier.com/achat
    anchor: Hotel avec un terrain de 4500
    window: 700
    units: 5
    expected_price: 250000
    check_sold: false
  - id: eco-lodge-nattes
    name: Eco-lodge Ile aux Nattes (Ceraolo)
    url: https://www.ceraolo-immobilier.com/achat
    anchor: Hotel Eco-lodge Iles aux Nates
    price_side: before
    units: 6
